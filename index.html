<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#58c9ee">
    <meta name="description" content="Um jogo de palavras inspirado no Termo, com visual Frutiger Aero.">
    <title>Termo — Um jogo de palavras</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            color: #15506b;
            background: #75d7f0;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 48px 20px;
            overflow-x: hidden;
            background:
                radial-gradient(ellipse at 14% 20%, rgba(255,255,255,.92) 0 3%, transparent 3.4%),
                radial-gradient(ellipse at 86% 28%, rgba(255,255,255,.75) 0 2%, transparent 2.5%),
                linear-gradient(180deg, #5bc9ed 0%, #b8eff7 56%, #e8fff3 100%);
            position: relative;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            z-index: 0;
            pointer-events: none;
            border-radius: 50%;
            background: linear-gradient(145deg, rgba(255,255,255,.75), rgba(255,255,255,.08));
            border: 1px solid rgba(255,255,255,.65);
            box-shadow: inset -10px -14px 24px rgba(34,158,195,.12), 0 10px 24px rgba(19,132,171,.12);
        }

        body::before { width: 120px; height: 120px; top: 12%; left: 7%; }
        body::after { width: 70px; height: 70px; right: 9%; bottom: 14%; }

        .page {
            width: min(100%, 620px);
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .game-card {
            padding: clamp(24px, 6vw, 48px);
            border: 1px solid rgba(255,255,255,.88);
            border-radius: 32px;
            background: linear-gradient(145deg, rgba(255,255,255,.87), rgba(226,250,255,.70));
            box-shadow: 0 24px 60px rgba(17,114,153,.22), inset 0 2px 0 rgba(255,255,255,.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .brand { text-align: center; margin-bottom: 30px; }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 13px;
            border: 1px solid rgba(255,255,255,.95);
            border-radius: 999px;
            color: #187396;
            background: linear-gradient(#faffff, #d7f5fb);
            box-shadow: 0 4px 10px rgba(26,136,170,.12), inset 0 1px 0 white;
            font-size: .75rem;
            font-weight: 800;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 14px 0 8px;
            color: #087ba5;
            font-size: clamp(2.6rem, 11vw, 4.5rem);
            line-height: .95;
            letter-spacing: -.07em;
            text-shadow: 0 2px 0 #fff, 0 5px 0 rgba(95,208,229,.35);
        }

        .subtitle { margin: 0; color: #4a7c8e; font-size: 1rem; }

        .instructions {
            margin: 0 auto 25px;
            max-width: 430px;
            padding: 14px 18px;
            border: 1px solid rgba(255,255,255,.9);
            border-radius: 18px;
            background: rgba(255,255,255,.55);
            color: #3d7184;
            text-align: center;
            line-height: 1.55;
        }

        #jogo { display: grid; gap: 12px; }
        #jogo form {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(5px, 2vw, 11px);
            flex-wrap: wrap;
            padding: 12px;
            border: 1px solid rgba(255,255,255,.8);
            border-radius: 20px;
            background: rgba(255,255,255,.46);
            box-shadow: inset 0 2px 6px rgba(42,148,177,.08);
        }

        /* Tiles prateados e brilhantes, inspirados nos ícones do Windows Vista. */
        #jogo input[type="text"] {
            width: clamp(42px, 12vw, 58px);
            height: clamp(48px, 13vw, 64px);
            border: 1px solid rgba(255,255,255,.96);
            border-radius: 15px;
            outline: none;
            background:
                linear-gradient(155deg, rgba(255,255,255,.82) 0%, rgba(255,255,255,.18) 42%, transparent 43%),
                linear-gradient(180deg, #d9e0e5 0%, #aeb9c1 48%, #8e9ba5 100%);
            box-shadow:
                0 5px 10px rgba(28,126,157,.16),
                inset 0 2px 3px rgba(255,255,255,.96),
                inset 0 -3px 5px rgba(75,89,101,.24);
            color: #234b60;
            font: 800 1.5rem/1 "Trebuchet MS", "Segoe UI", sans-serif;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 0 1px 0 rgba(255,255,255,.72);
            transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
        }

        #jogo input[type="text"]:focus {
            transform: translateY(-2px);
            border-color: #fff;
            box-shadow:
                0 0 0 4px rgba(52,185,216,.2),
                0 7px 14px rgba(28,126,157,.18),
                inset 0 2px 3px rgba(255,255,255,.98),
                inset 0 -3px 5px rgba(75,89,101,.2);
        }

        /* A lógica do jogo define as cores inline; estes estilos preservam os tons
           semânticos, aplicando acabamento metálico para cada resultado. */
        #jogo input[type="text"][style*="green"],
        #jogo input[type="text"][style*="green"]:focus {
            border-color: rgba(255,255,255,.98);
            background:
                linear-gradient(155deg, rgba(255,255,255,.8) 0%, rgba(255,255,255,.16) 42%, transparent 43%),
                linear-gradient(180deg, #a9ed9a 0%, #58c96a 48%, #29984e 100%) !important;
            box-shadow: 0 5px 10px rgba(30,125,65,.2), inset 0 2px 3px rgba(255,255,255,.95), inset 0 -3px 5px rgba(25,92,48,.28);
            color: #124a2a;
        }

        #jogo input[type="text"][style*="yellow"],
        #jogo input[type="text"][style*="yellow"]:focus {
            border-color: rgba(255,255,255,.98);
            background:
                linear-gradient(155deg, rgba(255,255,255,.84) 0%, rgba(255,255,255,.18) 42%, transparent 43%),
                linear-gradient(180deg, #fff2a6 0%, #f6d54d 48%, #d9a921 100%) !important;
            box-shadow: 0 5px 10px rgba(157,122,22,.2), inset 0 2px 3px rgba(255,255,255,.95), inset 0 -3px 5px rgba(128,91,12,.25);
            color: #60470d;
        }

        /* O jogo marca as letras incorretas como gray; a apresentação é vermelha. */
        #jogo input[type="text"][style*="gray"],
        #jogo input[type="text"][style*="gray"]:focus {
            border-color: rgba(255,255,255,.98);
            background:
                linear-gradient(155deg, rgba(255,255,255,.8) 0%, rgba(255,255,255,.16) 42%, transparent 43%),
                linear-gradient(180deg, #f3a0a0 0%, #df6268 48%, #b93848 100%) !important;
            box-shadow: 0 5px 10px rgba(157,48,57,.2), inset 0 2px 3px rgba(255,255,255,.95), inset 0 -3px 5px rgba(119,31,43,.27);
            color: #641f2a;
        }

        #jogo input[type="submit"] {
            min-height: 48px;
            padding: 0 20px;
            border: 1px solid #fff;
            border-radius: 999px;
            background: linear-gradient(180deg, #9be96b 0%, #55c944 48%, #2cae48 100%);
            box-shadow: 0 5px 0 #208d42, 0 8px 14px rgba(41,143,67,.23), inset 0 2px 0 rgba(255,255,255,.8);
            color: #fff;
            cursor: pointer;
            font: 800 .95rem "Trebuchet MS", "Segoe UI", sans-serif;
            text-shadow: 0 1px 2px rgba(17,106,43,.35);
            transition: transform .15s ease, filter .15s ease;
        }

        #jogo input[type="submit"]:hover { filter: brightness(1.06); transform: translateY(-2px); }
        #jogo input[type="submit"]:active { transform: translateY(2px); box-shadow: 0 2px 0 #208d42; }

        .used-letters {
            margin-top: 26px;
            padding: 18px 20px;
            border: 1px solid rgba(255,255,255,.9);
            border-radius: 20px;
            background: linear-gradient(145deg, rgba(223,249,255,.85), rgba(255,255,255,.7));
            box-shadow: inset 0 2px 0 rgba(255,255,255,.9), 0 7px 16px rgba(24,128,157,.09);
        }

        h2 {
            margin: 0 0 9px;
            color: #14799a;
            font-size: 1rem;
            letter-spacing: .02em;
        }

        #letrasultilizadas { min-height: 1.5em; color: #3d7184; font-weight: 700; letter-spacing: .18em; overflow-wrap: anywhere; }
        .footer { margin: 18px 0 0; color: #548496; font-size: .78rem; text-align: center; }

        @media (max-width: 480px) {
            body { padding: 24px 14px; }
            .game-card { border-radius: 25px; }
            #jogo form { padding: 10px 6px; }
            #jogo input[type="submit"] { flex-basis: 100%; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="game-card" aria-labelledby="titulo-jogo">
            <header class="brand">
                <span class="badge">☀️ Palavra do dia</span>
                <h1 id="titulo-jogo">TERMO</h1>
                <p class="subtitle">Um desafio de palavras com clima de verão</p>
            </header>

            <p class="instructions">Adivinhe a palavra de cinco letras. Verde indica a letra no lugar certo; amarelo indica uma letra que aparece em outra posição.</p>

            <div id="jogo" aria-label="Área do jogo"></div>

            <section class="used-letters" aria-labelledby="titulo-letras">
                <h2 id="titulo-letras">Letras utilizadas</h2>
                <div id="letrasultilizadas" aria-live="polite"></div>
            </section>
        </section>
        <p class="footer">Respire fundo, pense na palavra e divirta-se ✦</p>
    </main>
    <script src="termo.js"></script>
</body>
</html>
